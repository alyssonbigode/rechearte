<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d3526" />
    <title>Entrar - Rechearte Controle</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="login-screen">
      <section class="login-panel" aria-labelledby="login-title">
        <img class="login-logo" src="./assets/logo.jpeg" alt="Logo Rechearte" />
        <p class="eyebrow">Acesso restrito</p>
        <h1 id="login-title">Rechearte</h1>
        <form class="login-form" id="login-form">
          <label>
            Usuario
            <input id="login-user" autocomplete="username" required type="text" />
          </label>
          <label>
            Senha
            <input id="login-password" autocomplete="current-password" required type="password" />
          </label>
          <button class="primary-action" type="submit">Entrar</button>
          <p class="login-error" id="login-error" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="./login.js" type="module"></script>
  </body>
</html>
