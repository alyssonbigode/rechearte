<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d3526" />
    <title>Entrar - Rechearte Controle</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body.login-page {
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .login-page .login-screen {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 1.25rem;
      }

      .login-page .login-panel {
        width: min(100%, 25rem);
        padding: 2rem;
        border: 1px solid rgba(75, 33, 25, 0.14);
        border-radius: 0.5rem;
        background: rgba(255, 253, 245, 0.94);
        box-shadow: 0 18px 42px rgba(75, 33, 25, 0.12);
      }

      .login-page .login-logo {
        display: block;
        width: 6rem;
        height: 6rem;
        max-width: 6rem;
        margin: 0 auto 1rem;
        border: 1px solid rgba(75, 33, 25, 0.16);
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
      }

      .login-page .login-panel h1 {
        margin: 0 0 1.35rem;
        color: #4b2119;
        font-family: Georgia, serif;
        font-size: 2.4rem;
        line-height: 1.05;
        text-align: center;
      }

      .login-page .login-panel .eyebrow {
        margin: 0 0 0.2rem;
        text-align: center;
      }

      .login-page .login-form {
        display: grid;
        gap: 0.9rem;
        width: 100%;
      }

      .login-page .login-form input,
      .login-page .login-form button {
        width: 100%;
      }

      .login-page .login-error {
        min-height: 1.25rem;
        margin: 0;
        color: #9f1f2f;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-screen">
      <section class="login-panel" aria-labelledby="login-title">
        <img class="login-logo" src="./assets/logo.jpeg" alt="Logo Rechearte" />
        <p class="eyebrow">Acesso restrito</p>
        <h1 id="login-title">Rechearte</h1>
        <form class="login-form" id="login-form">
          <label>
            Usuario
            <input id="login-user" autocomplete="username" required type="text" />
          </label>
          <label>
            Senha
            <input id="login-password" autocomplete="current-password" required type="password" />
          </label>
          <button class="primary-action" type="submit">Entrar</button>
          <p class="login-error" id="login-error" role="alert"></p>
        </form>
      </section>
    </main>
    <script src="./login.js" type="module"></script>
  </body>
</html>
