name: Deploy Rechearte to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Baixar Código Mais Recente
        uses: actions/checkout@v4

      - name: Copiar arquivo .env do Servidor
        run: cp /opt/github/.env .

      - name: Subir Aplicação com Docker
        # Adicionado 'sudo' para dar permissão de acessar o Docker
        run: sudo docker compose up -d --build rechearte
