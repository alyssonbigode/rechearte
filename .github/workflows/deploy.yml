name: Deploy Rechearte to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Baixar Código Mais Recente
        uses: actions/checkout@v4

      - name: Configurar Login de Admin no Servidor
        run: |
          if ! grep -q "ADMIN_USER" /opt/github/.env; then
            echo "ADMIN_USER=admin" | sudo tee -a /opt/github/.env
            echo "ADMIN_PASS=rechearte123" | sudo tee -a /opt/github/.env
          fi
          cp /opt/github/.env .

      - name: Subir Aplicação com Docker
        # Adicionado 'sudo' para dar permissão de acessar o Docker
        run: sudo docker compose up -d --build rechearte
