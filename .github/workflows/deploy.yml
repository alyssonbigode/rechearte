name: Deploy Rechearte to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Baixar Código Mais Recente
        uses: actions/checkout@v4

      - name: Copiar arquivo .env do Servidor
        # Caminho atualizado baseado no print (agora esta em /opt/github/.env)
        run: cp /opt/github/.env .

      - name: Subir Aplicação com Docker
        run: docker compose up -d --build rechearte
